# Debian's GLX backend needs a GLSL version the Cloudbook's Mali-G52 lacks.
backend = "xrender";
vsync = false;
use-damage = true;
unredir-if-possible = true;
corner-radius = 8;
rules = (
    {
        match = "fullscreen || window_type = 'dock' || window_type = 'desktop' || class_g = 'Rofi' || class_g = 'Dunst'";
        corner-radius = 0;
    }
);
