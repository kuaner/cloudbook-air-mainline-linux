;; DECOR _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/sep]
type = custom/text
format = <label>
label = -

label-background = ${color.BACKGROUND}
label-foreground = ${color.BACKGROUND}

[module/dot]
type = custom/text
format = <label>
label = 

label-background = ${color.BACKGROUND}
label-foreground = ${color.ALTBACKGROUND}
label-padding = 2

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/LD]
type = custom/text
format = <label>
label = "%{T3}%{T-}"
label-background = ${color.BACKGROUND}
label-foreground = ${color.ALTBACKGROUND}

[module/RD]
type = custom/text
format = <label>
label = "%{T3}%{T-}"
label-background = ${color.BACKGROUND}
label-foreground = ${color.ALTBACKGROUND}

