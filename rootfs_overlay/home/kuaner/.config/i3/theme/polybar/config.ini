## Based on Archcraft i3's Polybar config by Aditya Shakya (GPL-3.0).

[global/wm]
include-file = ../system.ini
include-file = ./colors.ini
include-file = ./decor.ini
include-file = ./modules.ini

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = false
width = 100%
height = 30
border-size = 6
border-color = ${color.BACKGROUND}
background = ${color.BACKGROUND}
foreground = ${color.FOREGROUND}
fixed-center = true
dpi = 108
padding = 1
font-0 = JetBrains Mono:style=Bold:size=10;3
font-1 = Symbols Nerd Font:size=11;3
font-2 = Symbols Nerd Font:size=20;4
font-3 = Noto Sans CJK SC:size=10;3
font-4 = archcraft:size=15;4
modules-left = menu dot LD i3 RD dot tray
modules-right = volume dot backlight dot battery dot network dot LD date RD dot sysmenu
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[settings]
screenchange-reload = true
