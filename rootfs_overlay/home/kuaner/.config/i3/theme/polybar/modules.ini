## Based on Archcraft i3's Polybar modules by Aditya Shakya (GPL-3.0).

[module/menu]
type = custom/text
format = <label>
label = %{T5}%{T-}  应用
label-foreground = ${color.ACCENT}
click-left = ~/.config/i3/scripts/rofi_launcher
click-right = ~/.config/i3/scripts/rofi_runner

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
wrapping-scroll = false
format = <label-state> <label-mode>
format-background = ${color.ALTBACKGROUND}
label-focused = %{T2}%{T-} %index%
label-focused-foreground = ${color.ACCENT}
label-focused-padding = 1
label-unfocused = %{T2}%{T-} %index%
label-unfocused-padding = 1
label-visible = %index%
label-visible-padding = 1
label-urgent = %index%
label-urgent-foreground = ${color.RED}
label-urgent-padding = 1
label-mode-padding = 1

[module/tray]
type = internal/tray
format = <tray>
tray-spacing = 8px
tray-padding = 2px
tray-size = 66%

[module/volume]
type = custom/script
exec = amixer -D hw:CARD=rockchiprk809co sget Master | awk -F'[][]' '/Front Left:/{print $2; exit}'
interval = 2
format-prefix = "  "
format-prefix-font = 2
format-prefix-foreground = ${color.MAGENTA}
click-left = ~/.local/bin/cloudbook-volume up
click-right = ~/.local/bin/cloudbook-volume down
scroll-up = ~/.local/bin/cloudbook-volume up
scroll-down = ~/.local/bin/cloudbook-volume down

[module/backlight]
type = custom/script
exec = brightnessctl -c backlight -d backlight -m 2>/dev/null | cut -d, -f4
interval = 2
format-prefix = "  "
format-prefix-font = 2
format-prefix-foreground = ${color.YELLOW}
click-left = ~/.local/bin/cloudbook-brightness up
click-right = ~/.local/bin/cloudbook-brightness down
scroll-up = ~/.local/bin/cloudbook-brightness up
scroll-down = ~/.local/bin/cloudbook-brightness down

[module/battery]
type = internal/battery
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
full-at = 98
poll-interval = 5
format-charging = <label-charging>
format-charging-prefix = "  "
format-charging-prefix-font = 2
format-charging-prefix-foreground = ${color.GREEN}
format-discharging = <ramp-capacity>  <label-discharging>
format-full = <ramp-capacity>  <label-full>
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-font = 2
ramp-capacity-foreground = ${color.GREEN}
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

[module/network]
type = internal/network
interface = ${system.sys_network_interface}
interval = 4
format-connected = %{A1:xfce4-terminal --title=Wi-Fi -x nmtui-connect:}<label-connected>%{A}
format-connected-prefix = "  "
format-connected-prefix-font = 2
format-connected-prefix-foreground = ${color.BLUE}
format-disconnected = %{A1:xfce4-terminal --title=Wi-Fi -x nmtui-connect:}<label-disconnected>%{A}
format-disconnected-foreground = ${color.ALTFOREGROUND}
label-connected = Wi-Fi
label-disconnected = Wi-Fi 离线

[module/date]
type = internal/date
interval = 15
time = %H:%M
date = %m/%d
date-alt = %Y-%m-%d
format = <label>
format-background = ${color.ALTBACKGROUND}
format-prefix = "  "
format-prefix-font = 2
format-prefix-foreground = ${color.CYAN}
label = %date%  %time%

[module/sysmenu]
type = custom/text
format = <label>
label = 
label-font = 2
label-foreground = ${color.RED}
label-padding = 1
click-left = ~/.local/bin/cloudbook-powermenu
