; CloudBook Air polybar configuration.
; Colors come from ~/.config/polybar/colors.ini, which `i3-theme` regenerates
; from the same catppuccin/i3 flavour file that drives the i3 palette.
; Icons use FontAwesome 4.7 (Debian fonts-font-awesome).

include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
background = ${colors.base}
foreground = ${colors.text}
line-size = 2
line-color = ${colors.mauve}
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 0
module-margin-right = 1
font-0 = Noto Sans CJK SC:size=10;2
font-1 = FontAwesome:size=10;2
modules-left = i3
modules-center = date
modules-right = cpu memory network battery tray
cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
label-mode-padding = 2
label-focused = %index%
label-focused-foreground = ${colors.base}
label-focused-background = ${colors.mauve}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-foreground = ${colors.overlay1}
label-unfocused-padding = 2
label-urgent = %index%
label-urgent-foreground = ${colors.base}
label-urgent-background = ${colors.red}
label-urgent-padding = 2
label-separator = |
label-separator-padding = 1
label-separator-foreground = ${colors.overlay0}

[module/date]
type = internal/date
interval = 30
date = %Y-%m-%d
time = %H:%M
label =   %date% %time%
label-foreground = ${colors.subtext1}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.overlay1}
label = %percentage:2%%
label-foreground = ${colors.text}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.overlay1}
label = %percentage_used%%
label-foreground = ${colors.text}

[module/network]
type = internal/network
interface = wlan0
interval = 3
format-connected = <ramp-signal> <label-connected>
format-disconnected = <label-disconnected>
ramp-signal-0 = 
ramp-signal-1 = 
ramp-signal-2 = 
ramp-signal-3 = 
ramp-signal-4 = 
ramp-signal-foreground = ${colors.text}
label-connected = %essid%
label-connected-foreground = ${colors.text}
label-disconnected = 离线
label-disconnected-foreground = ${colors.overlay1}

[module/battery]
type = internal/battery
battery = sbs-0-000b
adapter = sc2021-typec
full-at = 98
poll-interval = 5
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.text}
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-foreground = ${colors.green}
animation-charging-framerate = 750
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-charging-foreground = ${colors.green}
label-discharging-foreground = ${colors.text}
label-full-foreground = ${colors.green}

[module/tray]
type = internal/tray
format = <tray>
tray-maxsize = 18
tray-padding = 2
tray-spacing = 4

[settings]
screenchange-reload = true
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
