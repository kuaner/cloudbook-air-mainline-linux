[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
background = #1e222a
foreground = #c8ccd4
line-size = 2
line-color = #da6e89
border-size = 6
border-color = #1e222a
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1
font-0 = JetBrains Mono:bold:size=10;3
font-1 = FontAwesome:size=11;3
font-2 = Symbols Nerd Font:size=13;4
font-3 = Noto Sans CJK SC:size=10;2
modules-left = menu i3
modules-center =
modules-right = volume dot backlight dot battery dot network dot date dot sysmenu
cursor-click = pointer
enable-ipc = true

[module/menu]
type = custom/text
content = " %{F#da6e89}%{F-}"
cursor-click = pointer
click-left = rofi -show drun

[module/sysmenu]
type = custom/text
content = " %{F#e06c75}%{F-}"
cursor-click = pointer
click-left = /home/cloudbook/.local/bin/cloudbook-powermenu

[module/dot]
type = custom/text
content = "|"
content-foreground = #3b4261

[module/LD]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = #292e39

[module/RD]
type = custom/text
content = "%{T2}%{T-}"
content-foreground = #292e39

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
label-mode-padding = 2
label-focused = %{T1}%{F#da6e89}%{F-}%{T-}
label-focused-padding = 3
label-unfocused = %{T1}%{F#5c6370}%{F-}%{T-}
label-unfocused-foreground = #727c91
label-unfocused-padding = 3
label-urgent = %{T1}%{F#c678dd}%{F-}%{T-}
label-urgent-foreground = #1e222a
label-urgent-background = #c678dd
label-urgent-padding = 3

[module/volume]
type = custom/script
exec = amixer -c 1 sget Master | awk -F'[][]' '/Front Left:/{print $2}'
interval = 1
format-prefix = " %{F#c8ccd4}%{F-} "
cursor-click = pointer
click-left = /home/cloudbook/.local/bin/cloudbook-volume up
click-right = /home/cloudbook/.local/bin/cloudbook-volume down
scroll-up = /home/cloudbook/.local/bin/cloudbook-volume up
scroll-down = /home/cloudbook/.local/bin/cloudbook-volume down

[module/backlight]
type = custom/script
exec = brightnessctl -m | awk -F, '{print $4}'
interval = 1
format-prefix = " %{F#e5c07b}%{F-} "
cursor-click = pointer
click-left = /home/cloudbook/.local/bin/cloudbook-brightness up
click-right = /home/cloudbook/.local/bin/cloudbook-brightness down
scroll-up = /home/cloudbook/.local/bin/cloudbook-brightness up
scroll-down = /home/cloudbook/.local/bin/cloudbook-brightness down

[module/battery]
type = internal/battery
battery = sbs-0-000b
adapter = sc2021-typec
full-at = 98
poll-interval = 5
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = #c8ccd4
animation-charging-0 = 
animation-charging-1 = 
animation-charging-framerate = 750
animation-charging-foreground = #98c379
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-charging-foreground = #98c379
label-full-foreground = #98c379
click-left = /home/cloudbook/.local/bin/cloudbook-battery
cursor-click = pointer

[module/network]
type = internal/network
interface = wlan0
interval = 3
format-connected = %{F#61afef}%{F-} <label-connected>
format-disconnected = %{F#727c91}%{F-} <label-disconnected>
label-connected = %essid%
label-connected-foreground = #c8ccd4
label-disconnected = 离线
label-disconnected-foreground = #727c91
click-left = xfce4-terminal -x nmtui-connect
cursor-click = pointer

[module/date]
type = internal/date
interval = 30
date = %Y-%m-%d
date-alt = %Y年%m月%d日
time = %H:%M
time-alt = %H:%M:%S
format = <label>

label = %{F#56b6c2}%{F-} %time%
label-foreground = #c8ccd4

[settings]
screenchange-reload = true
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
