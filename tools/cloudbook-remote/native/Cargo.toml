[package]
name = "cloudbook_remote"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.8"
anyhow = "1"
flate2 = "1"
hmac = "0.13"
jni = "0.21"
libc = "0.2"
log = "0.4"
pbkdf2 = "0.12"
plist = "1"
rand = "0.8"
rsa = "0.9"
sha1 = "0.11"
sha2 = "0.10"
socket2 = "0.6"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[profile.release]
strip = "debuginfo"
lto = "thin"
