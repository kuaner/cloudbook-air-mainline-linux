plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.kuaner.cloudbook.remote'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'io.github.kuaner.cloudbook.remote'
        minSdk 30
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.jniLibs.srcDir(layout.buildDirectory.dir('rust-jni'))
}

def nativeDir = rootProject.file('native')
def nativeOutput = layout.buildDirectory.dir('rust-jni')
def buildRust = tasks.register('buildRust', Exec) {
    inputs.files(fileTree(nativeDir) { include 'Cargo.*', 'src/**/*.rs' })
    inputs.file(rootProject.file('build-native.sh'))
    outputs.dir(nativeOutput)
    doFirst {
        commandLine 'bash', rootProject.file('build-native.sh'),
            androidComponents.sdkComponents.ndkDirectory.get().asFile,
            layout.buildDirectory.dir('cargo').get().asFile,
            nativeOutput.get().asFile
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('JniLibFolders')) {
        task.dependsOn buildRust
    }
}
