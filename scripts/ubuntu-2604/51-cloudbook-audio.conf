# HDMI is exposed as a fallback stereo sink even when its connector is empty.
# Prefer the RK809 speaker and headphone routes unless the user selects HDMI.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output[.]platform-rk809-sound[.].*" }
    ]
    actions = {
      update-props = { priority.session = 1100 }
    }
  }
]
